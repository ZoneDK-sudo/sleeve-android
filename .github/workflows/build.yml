name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and patch
        run: |
          unzip -o '*.zip'
          find . -name MainActivity.java -exec sed -i 's/mag(fft\[0\], 0)/mag(fft[0], (byte) 0)/' {} +
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --stacktrace
        working-directory: sleeve-android
      - uses: actions/upload-artifact@v4
        with:
          name: sleeve-apk
          path: sleeve-android/app/build/outputs/apk/debug/app-debug.apk
